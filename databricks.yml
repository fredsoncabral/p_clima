# This is a Declarative Automation Bundle definition for p_clima.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: p_clima
  uuid: 02d7e477-57f6-495f-bdeb-1077169f1387

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-90477c07-df94.cloud.databricks.com?w=7474649699582849
    variables:
      catalog: workspace
      schema: clima
  prod:
    mode: production
    workspace:
      host: https://dbc-90477c07-df94.cloud.databricks.com?w=7474649699582849
      # We explicitly deploy to /Workspace/Users/fredsoncbrl@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/fredsoncbrl@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: clima_prod
    permissions:
      - user_name: fredsoncbrl@gmail.com
        level: CAN_MANAGE

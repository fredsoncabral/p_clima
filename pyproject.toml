[project]
name = "p_clima"
version = "0.0.1"
authors = [{ name = "fredsoncabral" }]
description = "Plataforma de inteligência climática com dados do INMET no Databricks (bronze/silver/gold, ENSO, SPI, dashboard AI/BI)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31",
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
    "matplotlib>=3.11.2",
]

[project.scripts]
inmet = "p_clima.inmet.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p_clima"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

# This is a Declarative Automation Bundle definition for p_clima.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: p_clima
  uuid: 02d7e477-57f6-495f-bdeb-1077169f1387

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse usado pelos dashboards
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    # O workspace vem do perfil da CLI (--profile) ou de DATABRICKS_HOST — veja .env.example.
    variables:
      catalog: workspace
      schema: clima
  prod:
    mode: production
    workspace:
      # Caminho fixo no usuário que faz o deploy, para manter uma única cópia em produção.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: clima_prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
